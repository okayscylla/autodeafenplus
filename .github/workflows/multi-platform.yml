name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
      
      - name: Creating binary directory
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}\build\merged
          unzip D:/a/autodeafenplus/autodeafenplus/build/okayscylla.autodeafenplus.geode -d D:/a/autodeafenplus/autodeafenplus/build/merged
          rm D:/a/autodeafenplus/autodeafenplus/build/okayscylla.autodeafenplus.geode
          mkdir -p ${{ github.workspace }}\build\merged\binaries\win
          mv D:/a/autodeafenplus/autodeafenplus/build/merged/resources/libzmq.dll D:/a/autodeafenplus/autodeafenplus/build/merged/binaries/win
          zip -r D:/a/autodeafenplus/autodeafenplus/build/okayscylla.autodeafenplus.geode D:/a/autodeafenplus/autodeafenplus/build/merged/*

      - name: Upload the merged .geode mod file
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/build/okayscylla.autodeafenplus.geode
          archive: false
